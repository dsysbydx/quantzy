[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantzy"
version = "0.1.0"
description = "A quant investing library: alpha, risk, portfolio optimization, optimal trade."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Saran Ahuja" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "cvxpy>=1.5",
    "yfinance>=0.2.40",
    "pyarrow>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["quantzy*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
